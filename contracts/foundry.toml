[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read-write", path = "./deployments" }
]

# Robinhood Chain testnet (AGENTS.md §5). Mainnet 4663 ditambah saat dibutuhkan.
[rpc_endpoints]
robinhoodTestnet = "${ROBINHOOD_TESTNET_RPC}"
